name: RUANGKITA deployment smoke test

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment to probe
        required: true
        type: choice
        options:
          - production
          - preview

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RUANGKITA_BASE_URL: ${{ inputs.target == 'preview' && 'https://ruang-kita-git-feat-deployment-smoke-tests-akvisio-autohost.vercel.app' || 'https://ruang-kita-nine.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe public deployment and unauthenticated boundary
        run: node scripts/smoke-deployment.mjs
