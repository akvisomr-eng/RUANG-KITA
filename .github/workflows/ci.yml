name: RUANGKITA CI
on:
  push:
    branches: [main, 'dev/**', 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:static
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build