name: RUANGKITA CI
on:
  push:
    branches: [main, 'dev/**', 'feature/**', 'feat/**']
  pull_request:
    branches: [main, 'dev/**', 'feature/**', 'feat/**']
permissions:
  contents: read
concurrency:
  group: ruangkita-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:static
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build